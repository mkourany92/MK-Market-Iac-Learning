parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: parameterFile
    type: string
  - name: containerAppName
    type: string
  - name: containerAppRg
    type: string
  - name: acrName
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string
  - name: adminPassword
    type: string
    default: ""

steps:
  # 1. Deploy Bicep infrastructure (incremental — only changes apply)
  - task: AzureCLI@2
    displayName: "Deploy Bicep Infrastructure"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        EXTRA_PARAMS=""
        if [ -n "${{ parameters.adminPassword }}" ]; then
          EXTRA_PARAMS="adminPassword=${{ parameters.adminPassword }}"
        fi

        az deployment group create \
          --resource-group ${{ parameters.resourceGroup }} \
          --template-file infra/bicep/main.bicep \
          --parameters @${{ parameters.parameterFile }} \
          $( [ -n "$EXTRA_PARAMS" ] && echo "--parameters $EXTRA_PARAMS" ) \
          --mode Incremental

  # 2. Update Container App to use the newly built image
  - task: AzureCLI@2
    displayName: "Update Container App Image"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        # Configure managed identity for ACR pull (idempotent)
        az containerapp registry set \
          --name ${{ parameters.containerAppName }} \
          --resource-group ${{ parameters.containerAppRg }} \
          --server ${{ parameters.acrName }}.azurecr.io \
          --identity system

        # Update image
        az containerapp update \
          --name ${{ parameters.containerAppName }} \
          --resource-group ${{ parameters.containerAppRg }} \
          --image ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }}
  # 3. Smoke test — verify Container App returns 200

 
    displayName: "Smoke Test"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: 
        echo "Waiting for latest revision to become ready..."

        for i in $(seq 1 18); do
          RUNNING=$(az containerapp revision list \
            --name ${{ parameters.containerAppName }} \
            --resource-group ${{ parameters.containerAppRg }} \
            --query "[0].properties.runningState" -o tsv 2>/dev/null)

          echo "Attempt $i: revision state = $RUNNING"

          if [ "$RUNNING" = "Running" ]; then
            FQDN=$(az containerapp show \
              --name ${{ parameters.containerAppName }} \
              --resource-group ${{ parameters.containerAppRg }} \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "Smoke test PASSED — https://$FQDN"
            exit 0
          fi
          sleep 10
        done

        echo "Smoke test FAILED — revision never reached Running state"
        exit 1
        
|
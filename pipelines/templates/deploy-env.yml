parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: parameterFile
    type: string
  - name: containerAppName
    type: string
  - name: containerAppRg
    type: string
  - name: acrName
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string
  - name: adminPassword
    type: string
    default: ""

steps:
  # 1. Deploy Bicep infrastructure (incremental — only changes apply)
  - task: AzureCLI@2
    displayName: "Deploy Bicep Infrastructure"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        EXTRA_PARAMS=""
        if [ -n "${{ parameters.adminPassword }}" ]; then
          EXTRA_PARAMS="adminPassword=${{ parameters.adminPassword }}"
        fi

        az deployment group create \
          --resource-group ${{ parameters.resourceGroup }} \
          --template-file infra/bicep/main.bicep \
          --parameters @${{ parameters.parameterFile }} \
          $( [ -n "$EXTRA_PARAMS" ] && echo "--parameters $EXTRA_PARAMS" ) \
          --mode Incremental

  # 2. Assign AcrPull to Container App identity on shared ACR
  - task: AzureCLI@2
    displayName: "Assign AcrPull to Container App Identity"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        PRINCIPAL_ID=$(az containerapp show \
          --name ${{ parameters.containerAppName }} \
          --resource-group ${{ parameters.containerAppRg }} \
          --query identity.principalId -o tsv)

        echo "Container App principal ID: $PRINCIPAL_ID"

        ACR_SCOPE="/subscriptions/3e8bebe7-bf59-4cc5-a57f-0493328486e7/resourceGroups/mkmarket-dev-rg/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acrName }}"

        EXISTING=$(az role assignment list \
          --assignee-object-id $PRINCIPAL_ID \
          --role "AcrPull" \
          --scope $ACR_SCOPE \
          --query "[0].id" -o tsv 2>/dev/null)

        if [ -z "$EXISTING" ]; then
          echo "Assigning AcrPull..."
          az role assignment create \
            --assignee-object-id $PRINCIPAL_ID \
            --assignee-principal-type ServicePrincipal \
            --role "AcrPull" \
            --scope $ACR_SCOPE
          echo "AcrPull assigned. Waiting 30s for propagation..."
          sleep 30
        else
          echo "AcrPull already exists, skipping."
        fi

  # 3. Update Container App image
  - task: AzureCLI@2
    displayName: "Update Container App Image"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        # Configure managed identity for ACR pull (idempotent)
        az containerapp registry set \
          --name ${{ parameters.containerAppName }} \
          --resource-group ${{ parameters.containerAppRg }} \
          --server ${{ parameters.acrName }}.azurecr.io \
          --identity system

        # Update image
        az containerapp update \
          --name ${{ parameters.containerAppName }} \
          --resource-group ${{ parameters.containerAppRg }} \
          --image ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }} \
          --no-wait

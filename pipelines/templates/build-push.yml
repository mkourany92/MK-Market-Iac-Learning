parameters:
  - name: serviceConnection
    type: string
  - name: acrName
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string

steps:
- task: AzureCLI@2
  displayName: 'Build & Push Docker image to ACR'
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Login to ACR
      az acr login --name ${{ parameters.acrName }}
      
      # Build image
      docker build \
        -t ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }} \
        -t ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:latest \
        src/webapp/
      
      # Push both tags
      docker push ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:${{ parameters.imageTag }}
      docker push ${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:latest
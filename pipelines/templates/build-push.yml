parameters:
  - name: serviceConnection
    type: string
  - name: acrName
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string

steps:
  - task: AzureCLI@2
    displayName: "Build & Push Docker image to ACR"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        # Login to ACR
        #az acr login --name ${{ parameters.acrName }}

        # Build image
        az acr build \
          --registry ${{ parameters.acrName }} \
          --image ${{ parameters.imageRepository }}:${{ parameters.imageTag }} \
          --image ${{ parameters.imageRepository }}:latest \
          src/webapp/

